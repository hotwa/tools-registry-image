name: Build candidate image

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch, tag, or commit to build
        required: false
        default: main
  schedule:
    - cron: "17 20 * * *"
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: treg-candidate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.meta.outputs.candidate }}
      digest: ${{ steps.publish.outputs.digest }}
      upstream_revision: ${{ steps.upstream.outputs.revision }}
    steps:
      - name: Check out image pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pipeline configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          source pipeline.env
          owner=${GITHUB_REPOSITORY_OWNER,,}
          {
            printf 'image=ghcr.io/%s/%s\n' "$owner" "$IMAGE_NAME"
            printf 'epoch=%s\n' "$PIPELINE_EPOCH"
            printf 'upstream_repository=%s\n' "$UPSTREAM_REPOSITORY"
            printf 'upstream_default_ref=%s\n' "$UPSTREAM_DEFAULT_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch exact upstream revision
        id: upstream
        env:
          UPSTREAM_REPOSITORY: ${{ steps.config.outputs.upstream_repository }}
          UPSTREAM_DEFAULT_REF: ${{ steps.config.outputs.upstream_default_ref }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        shell: bash
        run: |
          set -euo pipefail
          ref=${REQUESTED_REF:-$UPSTREAM_DEFAULT_REF}
          revision=$(scripts/fetch-upstream.sh "$ref" upstream)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Derive immutable candidate reference
        id: meta
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          EPOCH: ${{ steps.config.outputs.epoch }}
          REVISION: ${{ steps.upstream.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$IMAGE:candidate-$EPOCH-$REVISION"
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'Candidate: %s\n' "$candidate" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether candidate already exists
        id: existing
        if: github.event_name != 'pull_request'
        env:
          CANDIDATE: ${{ steps.meta.outputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$CANDIDATE" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Candidate already exists; immutable tag will not be overwritten.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build test target and run pytest
        if: github.event_name == 'pull_request' || github.event_name == 'push' || steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: test
          push: false
          build-args: |
            TREG_SOURCE_REVISION=${{ steps.upstream.outputs.revision }}
            TREG_PIPELINE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=treg-image-test
          cache-to: type=gha,scope=treg-image-test,mode=max

      - name: Build and publish runtime candidate
        id: publish
        if: github.event_name != 'pull_request' && steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.candidate }}
          build-args: |
            TREG_SOURCE_REVISION=${{ steps.upstream.outputs.revision }}
            TREG_PIPELINE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.revision }}
            io.jmsu.treg.pipeline-revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=treg-image-runtime
            type=gha,scope=treg-image-test
          cache-to: type=gha,scope=treg-image-runtime,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest published image
        if: github.event_name != 'pull_request' && steps.existing.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.config.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Summarize publication
        if: github.event_name != 'pull_request' && steps.existing.outputs.exists != 'true'
        env:
          CANDIDATE: ${{ steps.meta.outputs.candidate }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          printf 'Published %s@%s\n' "${CANDIDATE%:*}" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
